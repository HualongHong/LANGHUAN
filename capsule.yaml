# ============================================================================
# capsule.yaml — LangHuan 仓库维护胶囊（人可读、机器可校验）
#
# 窄腰原则：本文件只固化「不可从仓库推导」的内容；凡能用命令得到答案的，
# 一律写成 state_queries 里的「查询命令」而不是「结论」。
#
# 区块分工（机器只动机器区）：
#   identity / invariants / state_queries / protocols / freeze —— 人工维护区，gen 不触碰
#   generated（# >>> generated 与 # <<< generated 标记之间）—— 机器区，gen/refresh 刷新
#
# 配套工具：python scripts/capsule.py {gen|audit|refresh}
# ============================================================================

identity:
  name: langhuan
  one_liner: 面向 Agent 宿主（DSH / Kimi 等）的科研证据处理技能套件：题录结构化、图版组装、核验策略、合作评估。
  non_goals:
    - 不做通用爬虫框架
    - 不做论文写作 / 投稿 / 排版
    - 不把任何宿主特有插件变成硬依赖

# >>> generated by scripts/capsule.py — do not edit
generated:
  refreshed_at: "2026-10-13T23:19:26"
  suite_version: "0.1.0-dev"
  member_count: 4
# <<< generated

invariants:
  - id: naming-prefix
    rule: 所有技能 SKILL.md frontmatter 的 name 必须带 langhuan- 前缀（分发命名约定，见根 AGENTS.md「技能分发形态」）。
    check: "test -z \"$(grep -L '^name: langhuan-' skills/*/SKILL.md)\""

  - id: no-secret
    rule: .env 不入库（gitignore 生效），且 git 跟踪文件中不得出现真实密钥形状的赋值（AGENTKIT_* / *_API_KEY 后跟 sk-长串或 30+ 位裸 token；文档占位符如 sk-xxx、your-... 不算）。
    check: "git check-ignore -q .env && test -z \"$(git grep -Il -E \"(AGENTKIT_[A-Z0-9_]*(KEY|TOKEN|SECRET)|[A-Z0-9_]+_API_KEY)=[\\\"']?(sk-[A-Za-z0-9]{15,}[0-9][A-Za-z0-9]{15,}|[A-Za-z0-9]{30,})\" -- . ':!*.example' 2>/dev/null)\""

  - id: suite-yaml-sync
    rule: suite.yaml 声明的每个成员目录必须存在且含 SKILL.md（suite.yaml 是构建唯一事实来源，成员不得悬空）。
    check: "grep -q 'path: skills/' suite.yaml && grep -oE 'path: skills/[A-Za-z0-9._/-]+' suite.yaml | awk '{print $2}' | while read -r d; do test -d \"$d\" && test -f \"$d/SKILL.md\" || exit 1; done"

  - id: dev-log-append-only
    rule: docs/DEV_LOG.md 非空，且最新条目日期不早于最近一次 git 提交日期（近似校验「先写 DEV_LOG 再提交」，同日视为通过）。
    check: "test -s docs/DEV_LOG.md && python -B -c \"import re,subprocess,sys; t=subprocess.run(['git','log','-1','--format=%cs'],capture_output=True,text=True).stdout.strip(); d=re.findall(r'## (20\\d\\d-\\d\\d-\\d\\d)', open('docs/DEV_LOG.md',encoding='utf-8').read()); sys.exit(0 if (d and max(d)>=t) else 1)\""

state_queries:
  - id: members
    ask: 套件当前有哪些成员、什么版本与状态
    run: "awk '/^  - name:/{n=$3} /^    version:/{v=$2; gsub(/\"/,\"\",v)} /^    status:/{print n\" | \"v\" | \"$2}' suite.yaml"

  - id: recent-commits
    ask: 最近五次提交
    run: "git log --oneline -5"

  - id: worktree-status
    ask: 工作区是否干净（有无未提交改动）
    run: "git status --porcelain; if [ -z \"$(git status --porcelain)\" ]; then echo 'worktree: clean'; else echo 'worktree: dirty'; fi"

  - id: installed-sync
    ask: 已安装技能目录（C:/Users/hongh/.agents/skills/）与上游的 diff 状态（只读比对；目录不存在时提示跳过而非报错）
    run: "for s in skills/*/; do n=\"langhuan-$(basename \"$s\")\"; t=\"C:/Users/hongh/.agents/skills/$n\"; if [ -d \"$t\" ]; then if diff -rq \"$s\" \"$t\" >/dev/null 2>&1; then echo \"$n: in sync\"; else echo \"$n: differs\"; diff -rq \"$s\" \"$t\" 2>/dev/null | head -3; fi; else echo \"$n: not installed (skipped)\"; fi; done"

protocols:
  - id: regenerate-not-patch
    rule: 由脚本生成的产物（HANDOFF.md、发布包、报告表等）不得手工 patch；要改就改生成器或配置后重跑生成。
    evidence: 伶俐项目 18_manuscript_build.py 被编辑 130 次、全项目 30 次 edit 因锚点不匹配失败——对生成物做文本 patch 是主要摩擦源。

  - id: user-edited-format
    rule: 用户手工调整过的格式 / 排版不得回改；只在其基础上做增量修改。
    evidence: 用户多次明确要求「不要改回去」「在我改的基础上改」。

  - id: no-silent-drop
    rule: 剔除任何数据 / 记录 / 文件前，必须先记录决定与理由（DEV_LOG 或产物附注），不得静默删除。
    evidence: 静默剔除不可审计、不可复现，后续反馈无法溯源。

  - id: no-internal-codes
    rule: 内部代号（H1/H2、t29/t33、Axis A/B/C 等）不得出现在交付给用户的文本中。
    evidence: 内部编号会随会话漂移、无稳定语义，进入交付文本只会混淆交付对象。

  - id: learn-from-feedback
    rule: 接收人审 / AI 审意见时先判事实：不成立则给出理由并拒绝；成立则举一反三、全局排查同类问题。
    evidence: 用户连续四个批次（fll/cyf/lym/hhl）下达同一套要求——单点修复不修根因，问题会反复出现。

freeze:
  procedure:
    - 建立版本目录 release/vX.Y/
    - 生成 MANIFEST.sha256（逐文件哈希清单）
    - 下游消费表 / 产物与上一冻结版逐字节零回归比对
    - 写 FROZEN.md 记录冻结点与比对结论
  evidence: 伶俐项目 13 次冻结均按此执行；逐字节比对是发现回归的关键手段。
