[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "lit-scout-harvester"
version = "0.3.0"
description = "LangHuan Suite · Literature Information Extraction Agent for WOS and beyond"
authors = ["LangHuan Suite <dev@langhuan.ai>"]
readme = "README.md"
license = "MIT"
packages = [{include = "lit_scout_harvester"}]
include = [
    "lit_scout_harvester/schemas/*.json",
    "lit_scout_harvester/external/*.csv",
    "config/*.yaml",
    "config/*.md",
]

[tool.poetry.dependencies]
python = "^3.8"
pandas = "^1.5.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
pyyaml = "^6.0"
pycountry = "^22.0"
aiohttp = "^3.8.0"
aiofiles = "^23.0.0"
geopy = "^2.3.0"
fasttext-wheel = "^0.9.2"
langdetect = "^1.0.9"
requests = "^2.28.0"
rich = "^13.0.0"
click = "^8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-benchmark = "^4.0.0"
pytest-cov = "^4.1.0"
mypy = "^1.5.0"
black = "^23.0.0"
isort = "^5.12.0"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
