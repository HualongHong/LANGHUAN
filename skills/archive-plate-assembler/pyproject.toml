[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-plate-assembler"
version = "0.1.0.dev0"
description = "LangHuan Suite: scanned-plate book (图鉴) PDF to structured species JSON pipeline"
readme = "SKILL.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # 节点 1：PDF 渲染
    "PyMuPDF>=1.24",
    # 节点 5：图像处理
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "rembg>=2.0",
    "onnxruntime>=1.17",
    # Schema 与数据校验
    "pydantic>=2.0",
    # HTTP 客户端（模型网关）
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # 人工校验界面（M4a）
    "streamlit>=1.59",
]

[tool.setuptools.packages.find]
include = ["archive_plate_assembler*"]
namespaces = false
